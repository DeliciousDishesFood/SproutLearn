<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239AE600'/%3E%3Cpath d='M16 25V13' stroke='%23171A1F' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 15c0-4 3-7 8-7 0 5-3 8-8 8Z' fill='%23171A1F'/%3E%3Cpath d='M15 19c0-3-2.5-5.5-7-5.5 0 4 2.5 6.5 7 6.5Z' fill='%23171A1F' opacity='.55'/%3E%3C/svg%3E"
    />
    <title>青芽 SproutLearn</title>
    <script>
      // 防 FOUC：首帧前确定明暗主题（用户选择优先，否则跟随系统）
      ;(function () {
        try {
          var stored = localStorage.getItem('sprout.v3.theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
