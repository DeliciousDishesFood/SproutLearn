# 青芽 SproutLearn · 生产 compose（在仓库根执行）
# 启动：docker compose -f deploy/docker-compose.yml up -d --build
name: sproutlearn

services:
  mysql:
    image: mysql:8.0
    restart: always
    env_file: ../.env
    environment:
      # 敏感值全部由 env_file 注入：Compose 的项目目录是 deploy/，
      # 若用 ${MYSQL_PASSWORD} 插值会读不到仓库根 .env，导致密码为空。
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sproutlearn_net]
    # 生产不暴露端口

  redis:
    image: redis:7-alpine
    restart: always
    env_file: ../.env
    # 使用容器内 $$REDIS_PASSWORD（Compose 转义），不依赖宿主机插值
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sproutlearn_net]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant:v1.12.4 镜像内没有 wget/curl，用 bash 的 /dev/tcp 做端口探活
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sproutlearn_net]
    # 生产不暴露 6333；如需调试再临时映射 127.0.0.1:6333

  api:
    build: ../backend
    restart: always
    env_file: ../.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks: [sproutlearn_net]

  bot-worker:
    build: ../backend
    restart: always
    env_file: ../.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: python -m app.qq_bot_worker
    networks: [sproutlearn_net]

  web:
    # 新前端唯一生产入口；旧 frontend/ 仅保留历史参考。
    build: ../frontend-v3
    restart: always
    ports:
      - "80:80"
      # "443:443" 留到 M5 接域名 + 证书时开启；M1 不 listen 443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [api]
    networks: [sproutlearn_net]

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  uploads_data:

networks:
  sproutlearn_net:
    driver: bridge
